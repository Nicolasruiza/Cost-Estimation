<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initiative Cost Estimator</title><style>html,body{margin:0;min-height:100%;background:#070b12;color:#e8edf5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#8896a8;font-size:14px}</style></head><body><div class="loading">Loading Initiative Cost Estimator…</div><script>(async()=>{try{const parts=await Promise.all(['parts/cost-1.txt','parts/cost-2.txt','parts/cost-3.txt'].map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p);return r.text()})));const b64=parts.join('').trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();/* Public portfolio build: delete employer branding rather than replacing or masking it. These raw replacements also sanitize any export templates embedded inside scripts. */html=html.replace(/Tangerine(?:\s+Bank)?/gi,'').replace(/Scotiabank/gi,'').replace(/FORWARD\s+BANKING/gi,'').replace(/<img\b[^>]*(?:tangerine|scotiabank)[^>]*>/gi,'').replace(/<svg\b[^>]*(?:tangerine|scotiabank)[\s\S]*?<\/svg>/gi,'');const parsed=new DOMParser().parseFromString(html,'text/html');const brandRe=/tangerine|scotiabank|forward\s+banking/i;function stripBranding(root){const scope=root&&root.querySelectorAll?root:document;scope.querySelectorAll('img,svg').forEach(el=>{const s=[el.getAttribute('src'),el.getAttribute('alt'),el.getAttribute('aria-label'),el.id,el.className&&String(el.className.baseVal||el.className)].filter(Boolean).join(' ');if(brandRe.test(s))el.remove()});scope.querySelectorAll('[class*="logo"],[id*="logo"],[class*="brand"],[id*="brand"]').forEach(el=>{const s=((el.textContent||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')).trim();if(!s||brandRe.test(s))el.remove()});const candidates=[...scope.querySelectorAll('body *')].filter(el=>{const t=(el.textContent||'').replace(/\s+/g,' ').trim();return t.length<220&&brandRe.test(t)}).sort((a,b)=>(a.textContent||'').length-(b.textContent||'').length);candidates.forEach(el=>{if(!el.isConnected)return;let target=el;while(target.parentElement&&target.parentElement!==parsed.body){const t=(target.parentElement.textContent||'').replace(/\s+/g,' ').trim();if(t.length>=260||!brandRe.test(t))break;target=target.parentElement}target.remove()})}stripBranding(parsed);const runtime=parsed.createElement('script');runtime.textContent="(()=>{const re=/tangerine|scotiabank|forward\\s+banking/i;function strip(root=document){root.querySelectorAll('img,svg').forEach(el=>{const s=[el.getAttribute('src'),el.getAttribute('alt'),el.getAttribute('aria-label'),el.id,el.className&&String(el.className.baseVal||el.className)].filter(Boolean).join(' ');if(re.test(s))el.remove()});root.querySelectorAll('[class*=\\\"logo\\\"],[id*=\\\"logo\\\"],[class*=\\\"brand\\\"],[id*=\\\"brand\\\"]').forEach(el=>{const s=((el.textContent||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')).trim();if(!s||re.test(s))el.remove()});[...root.querySelectorAll('body *')].filter(el=>{const t=(el.textContent||'').replace(/\\s+/g,' ').trim();return t.length<220&&re.test(t)}).forEach(el=>el.remove())}const run=()=>strip(document);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();new MutationObserver(run).observe(document.documentElement,{subtree:true,childList:true})})();";parsed.body.appendChild(runtime);document.open();document.write('<!doctype html>'+parsed.documentElement.outerHTML);document.close()}catch(e){document.body.innerHTML='<div class="loading">Unable to load the estimator. Please refresh.</div>';console.error(e)}})();</script></body></html>
