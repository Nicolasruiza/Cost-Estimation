<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initiative Cost Estimator</title><style>html,body{margin:0;min-height:100%;background:#070b12;color:#e8edf5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#8896a8;font-size:14px}</style></head><body><div class="loading">Loading Initiative Cost Estimator…</div><script>(async()=>{try{const parts=await Promise.all(['parts/cost-1.txt','parts/cost-2.txt','parts/cost-3.txt'].map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p);return r.text()})));const b64=parts.join('').trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading">Unable to load the estimator. Please refresh.</div>';console.error(e)}})();</script></body></html>
